[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pm25"
version = "0.1.0"
description = "ML spatial enhancement of CAMS EAC4 PM2.5 over India"
requires-python = ">=3.11"
# Dependencies are managed by conda (environment.yml), not pip.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
