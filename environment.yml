name: pm25
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - xarray
  - netcdf4
  - dask
  - xesmf
  - cartopy
  - matplotlib
  - scikit-learn
  - lightgbm
  - pykrige
  - shap
  - jupyterlab
  - ipykernel
  - ruff
  - pytest
  - pandoc  # report conversion (step 12)
  - typst  # PDF engine for pandoc, much lighter than LaTeX
  - pip
  - pip:
      - cdsapi
      - -e .  # this project (src/pm25), so scripts run without PYTHONPATH
